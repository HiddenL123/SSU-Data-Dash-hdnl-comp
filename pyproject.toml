[project]
name = "ssu-data-dash"
version = "0.1.0"
requires-python = ">=3.11,<3.14"

dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.9",
    "huggingface_hub==2.1.1",

    "catboost>=1.2.8,<2",
    "lightgbm>=4.0,<5",
    "xgboost>=2.1,<3",
    "statsmodels>=0.14.4,<0.16",
    "pygam>=0.10,<0.13",

    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "pytest==8.4.2",
]

[project.optional-dependencies]
gpboost = [
    "gpboost==1.7.4",
]

ydf = [
    "ydf==0.16.1; sys_platform == 'linux'",
]

[tool.uv]
package = false